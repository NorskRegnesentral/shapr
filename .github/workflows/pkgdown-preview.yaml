on:
  workflow_dispatch:

name: pkgdown preview

jobs:
  pkgdown-preview:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Copy pyshapr documentation
        run: |
          file.copy("python/README.md", ".github/pyshapr.md")
          file.copy("python/CHANGELOG.md", ".github/py_changelog.md")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy preview
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          branch: gh-pages
          folder: docs
          target-folder: previews/${{ github.ref_name }}
          clean: false

      - name: Add preview URL to summary
        run: |
          echo "## pkgdown preview" >> "$GITHUB_STEP_SUMMARY"
          echo "https://norskregnesentral.github.io/shapr/previews/${GITHUB_REF_NAME}/" >> "$GITHUB_STEP_SUMMARY"
