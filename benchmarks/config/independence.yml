# ============================================================================
# independence.yml — cost study for the `independence` approach.
#
# independence is parameter-free and supports every dataset family, so besides
# the standard numeric OAT battery it runs the `dataset` sweep across all four
# mixed settings and the categorical data. Baseline stays numeric (to line up
# with the gaussian/numeric reference). Inherits the 12-hour timeout and
# 96-hour budget.
#
# Run with:  bin/orchestrate.sh config/independence.yml
# ============================================================================
approach: independence
dataset: numeric

blocks:
  - name: scale_train_mc
    grid:
      n_train: [500, 2500, 10000, 20000]
      n_MC_samples: [50, 250, 1000]

  - name: features
    grid:
      n_features: [4, 8, 12, 16, 20, 30]

  - name: coalitions
    grid:
      max_n_coalitions: [16, 64, 128, 256, 512, 1024]

  - name: explain
    grid:
      n_explain: [1, 10, 25, 50, 100]

  - name: dt_threads
    grid:
      dt_threads: [1, 2, 4, 8]

  - name: parallel
    grid:
      workers: [1, 2, 4, 8, 16, 32]
      min_n_batches: [8, 32, 128]

  - name: batches
    grid:
      min_n_batches: [1, 2, 5, 10, 25, 50]
      max_batch_cube_size: [Inf]

  - name: iterative_budget
    pair: iterative
    grid:
      max_n_coalitions: [256, 1024]

  # Data-setting sweep: four mixed settings (few/many factor columns x
  # few/many levels) + all-categorical.
  - name: dataset
    grid:
      dataset: [mixed_fc_fl, mixed_fc_ml, mixed_mc_fl, mixed_mc_ml, categorical]
