# Optional dense-batch memory-budget calibration; excluded from run_week.sh.
# The cap levels translate into progressively fewer/larger Gaussian batches.
approach: gaussian
dataset: numeric

replicates: 2
cooldown_sec: 0.2
timeout_sec: 1800
time_budget_sec: 7200

blocks:
  - name: memory_cap_sequential
    grid:
      n_features: [12]
      n_train: [1000]
      max_n_coalitions: [1024]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [1]
      min_n_batches: [8]
      max_batch_cube_size: [1e6, 4e6, 16e6, 64e6, Inf]

  - name: memory_cap_parallel
    grid:
      n_features: [12]
      n_train: [1000]
      max_n_coalitions: [1024]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [4]
      min_n_batches: [8]
      max_batch_cube_size: [1e6, 4e6, 16e6, 64e6, Inf]

  - name: memory_cap_highdim
    grid:
      n_features: [20]
      n_train: [1000]
      max_n_coalitions: [512]
      n_MC_samples: [250]
      n_explain: [50]
      workers: [1]
      min_n_batches: [8]
      max_batch_cube_size: [1e6, 4e6, 16e6, 64e6, Inf]
