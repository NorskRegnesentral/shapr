# Optional realistic-workload parallel study; excluded from run_week.sh.
approach: ctree
dataset: numeric

replicates: 2
warmup: false
cooldown_sec: 0.2
timeout_sec: 1800
time_budget_sec: 14400

blocks:
  - name: medium_sequential
    grid:
      n_train: [5000]
      max_n_coalitions: [256]
      n_explain: [25]
      workers: [1]
      min_n_batches: [1, 8, 32]

  - name: medium_parallel
    grid:
      n_train: [5000]
      max_n_coalitions: [256]
      n_explain: [25]
      workers: [4, 8, 16]
      min_n_batches: [8, 32]

  - name: heavy_sequential
    grid:
      n_train: [5000]
      max_n_coalitions: [512]
      n_explain: [100]
      workers: [1]
      min_n_batches: [1, 8, 32]

  - name: heavy_parallel
    grid:
      n_train: [5000]
      max_n_coalitions: [512]
      n_explain: [100]
      workers: [4, 8, 16]
      min_n_batches: [8, 32]
