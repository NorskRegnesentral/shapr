# ============================================================================
# ctree.yml — cost study for the `ctree` approach.
#
# ctree fits a conditional-inference tree per coalition and is one of the more
# expensive approaches (and memory-heavy in the iterative setting), so grids are
# somewhat coarser than gaussian's. Supports all dataset families -> includes
# the mixed/categorical `dataset` sweep. Baseline numeric. Inherits timeout
# (1 h) + 24 h budget.
#
# Run with:  bin/orchestrate.sh config/ctree.yml
# ============================================================================
approach: ctree
dataset: numeric

blocks:
  - name: scale_train_mc
    grid:
      n_train: [500, 5000, 20000]
      n_MC_samples: [50, 250, 1000]

  - name: features
    grid:
      n_features: [4, 8, 12, 16, 20]

  - name: coalitions
    grid:
      max_n_coalitions: [32, 128, 256, 512]

  - name: explain
    grid:
      n_explain: [1, 25, 100]

  - name: dt_threads
    grid:
      dt_threads: [1, 2, 4, 8]

  - name: parallel
    grid:
      workers: [1, 2, 4, 8, 16, 32]
      min_n_batches: [8, 32, 128]

  - name: batches
    grid:
      min_n_batches: [1, 5, 25]
      max_batch_cube_size: [Inf]

  - name: iterative_budget
    pair: iterative
    grid:
      max_n_coalitions: [256, 1024]

  - name: dataset
    grid:
      dataset: [mixed_fc_fl, mixed_fc_ml, mixed_mc_fl, mixed_mc_ml, categorical]

  # Realistic medium/heavy workloads for parallel-efficiency guidance.
  - name: realistic_medium
    grid:
      n_train: [5000]
      max_n_coalitions: [256]
      n_explain: [25]
      workers: [1, 4, 8, 16]
      min_n_batches: [8, 32]

  - name: realistic_medium_low_batch
    grid:
      n_train: [5000]
      max_n_coalitions: [256]
      n_explain: [25]
      workers: [1]
      min_n_batches: [1]

  - name: realistic_heavy
    grid:
      n_train: [5000]
      max_n_coalitions: [512]
      n_explain: [100]
      workers: [1, 4, 8, 16]
      min_n_batches: [8, 32]

  - name: realistic_heavy_low_batch
    grid:
      n_train: [5000]
      max_n_coalitions: [512]
      n_explain: [100]
      workers: [1]
      min_n_batches: [1]
