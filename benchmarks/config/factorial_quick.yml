# ============================================================================
# factorial_quick.yml — partial-factorial study, ~1 hour "smoke" scale
#
# Full cross-product over the dimensions in `factors`. Every dimension NOT
# listed in `factors` is held fixed (see `fixed`, falling back to the baseline
# in common.yml). Captures interactions that the OAT design cannot.
#
# Keep the number of factor combinations small for the quick tier:
#   |approach| x |n_train| x |n_MC_samples| x |workers|
#
# Merged on top of common.yml.
# ============================================================================
design: factorial
scale: quick

replicates: 1
warmup: false      # smoke run: skip the extra warm-up replicate to stay ~1 h

factors:
  approach: [gaussian, ctree, arf]
  n_train: [100, 1000, 5000]
  n_MC_samples: [100, 1000]
  workers: [1, 4]

fixed:
  dataset: mixed       # ctree/arf support factors; gaussian skipped on mixed
  n_features: 6
  max_n_coalitions: 128
  min_n_batches: 10
  backend: multisession
  n_explain: 25
  iterative: false
