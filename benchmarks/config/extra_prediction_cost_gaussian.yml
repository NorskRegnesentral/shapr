# Optional prediction-cost sensitivity variant; excluded from run_week.sh.
# benchmark.prediction_repeats repeats the native model prediction while
# returning identical values, isolating how model-evaluation cost changes the
# benefit of parallel batches.
approach: gaussian
dataset: numeric

replicates: 2
warmup: false
cooldown_sec: 0.2
timeout_sec: 1800
time_budget_sec: 7200

blocks:
  - name: prediction_cost_sequential
    grid:
      n_features: [12]
      n_train: [1000]
      max_n_coalitions: [512]
      n_MC_samples: [250]
      n_explain: [50]
      workers: [1]
      min_n_batches: [32]
      max_batch_cube_size: [Inf]
    approach_args:
      benchmark.prediction_repeats: [1, 4, 16]

  - name: prediction_cost_parallel
    grid:
      n_features: [12]
      n_train: [1000]
      max_n_coalitions: [512]
      n_MC_samples: [250]
      n_explain: [50]
      workers: [4, 16]
      min_n_batches: [32]
      max_batch_cube_size: [Inf]
    approach_args:
      benchmark.prediction_repeats: [1, 4, 16]
