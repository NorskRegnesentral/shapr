# Optional combined accuracy-cost and interaction study; excluded from
# run_week.sh. Saved Shapley values and accuracy CSVs stay inside the matching
# extra_* result directory, so this study can be discarded independently.
approach: gaussian
dataset: numeric

replicates: 3
save_explanations: true
cooldown_sec: 0.2
timeout_sec: 900
time_budget_sec: 7200

blocks:
  - name: accuracy_cost
    grid:
      n_features: [8]
      n_train: [1000]
      max_n_coalitions: [32, 64, 128, 256]
      n_MC_samples: [25, 100, 400]
      n_explain: [10, 50]
      workers: [1]
      min_n_batches: [16]
      max_batch_cube_size: [Inf]

  - name: accuracy_reference
    grid:
      n_features: [8]
      n_train: [1000]
      max_n_coalitions: [256]
      n_MC_samples: [2000]
      n_explain: [50]
      workers: [1]
      min_n_batches: [32]
      max_batch_cube_size: [Inf]
