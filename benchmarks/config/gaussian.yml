# ============================================================================
# gaussian.yml — PRIMARY, comprehensive cost study for the `gaussian` approach.
#
# gaussian is the cheapest general approach and the reference method, so it is
# the main testbed: it gets the BROADEST set of blocks (dense scaling grids, a
# full feature sweep up to 30, grouping on/off + a group-size sweep, the
# batching / cube-size levers, parallel scaling, and an iterative pair). Other
# approaches get lighter, targeted coverage of their own cost drivers.
#
# COST NOTE: for the sampling approaches, run time scales roughly with
# max_n_coalitions * n_MC_samples * n_explain * n_features. The high-coalition
# corner (e.g. 4000 coalitions at many features) is minutes-to-tens-of-minutes
# per run, so the grids below keep max_n_coalitions moderate; the cube-size cap
# study probes high dimensions at moderate coalition counts instead.
#
# One study = one approach = a list of `blocks`, each a small mini-design around
# the shared baseline (see common.yml). Anything here overrides common.yml.
#
# Run with:  bin/orchestrate.sh config/gaussian.yml
# ============================================================================
approach: gaussian
dataset: numeric        # gaussian supports the all-numeric data
model_variant: xgb

# The 12-hour per-run timeout and 96-hour study budget are inherited from common.yml.

blocks:
  # 1. Core cost surface: training rows x MC samples (dense).
  - name: scale_train_mc
    grid:
      n_train: [250, 1000, 2500, 5000, 10000, 20000]
      n_MC_samples: [25, 100, 250, 500, 1000]

  # 2. Dimensionality: a dense feature sweep in the sampling regime (up to the
  #    numeric ceiling of 30 features).
  - name: features
    grid:
      n_features: [2, 4, 6, 8, 10, 12, 16, 20, 25, 30]

  # 3. Coalition-budget sweep (kept <= 1024 to stay well inside the timeout).
  - name: coalitions
    grid:
      max_n_coalitions: [16, 32, 64, 128, 256, 512, 1024]

  # 4. High-dimensional batching study: n_features x coalitions with the dense
  #    per-batch cap ON (1e6, shapr default) vs OFF (Inf). Isolates the effect
  #    of max_batch_cube_size auto-batching on time and peak RAM. Moderate
  #    coalition counts keep each run bounded even with 30 features.
  - name: highdim_cap
    grid:
      n_features: [12, 20, 30]
      max_n_coalitions: [128, 512]
      max_batch_cube_size: [1e6, Inf]

  # 5. Grouping vs not, across feature counts (grouped Shapley reduces the
  #    effective dimensionality, so cost differs a lot).
  - name: grouping
    grid:
      n_features: [8, 12, 20, 30]
      group: [false, true]

  # 6. Group granularity: sweep group_size (coarser groups = fewer groups) at
  #    high dimension, grouped only.
  - name: group_size
    grid:
      n_features: [20, 30]
      group: [true]
      group_size: [2, 3, 5, 10]

  # 7. Explicand-count sweep.
  - name: explain
    grid:
      n_explain: [1, 5, 10, 25, 50, 100]

  # 8. Parallel scaling COMBINED WITH BATCHING (regular multisession backend):
  #    shapr parallelizes over batches, so workers only help with enough
  #    batches. Cross workers with min_n_batches up to this machine's 32 cores.
  - name: parallel_batching
    grid:
      workers: [1, 2, 4, 8, 16, 32]
      min_n_batches: [8, 32, 128]

  # 9. Parallelization VARIANTS: regular (multisession) vs forking (multicore)
  #    across the full worker range, at a fixed high batch count.
  - name: parallel_backend
    grid:
      workers: [1, 2, 4, 8, 16, 32]
      backend: [multisession, multicore]
      min_n_batches: [32]

  # 10. data.table thread count (the other parallelism lever), swept alone.
  - name: dt_threads
    grid:
      dt_threads: [1, 2, 4, 8]

  # 11. Batching lever, isolated: sweep min_n_batches with the cube-size cap OFF
  #     (Inf) and max_batch_size Inf so min_n_batches alone governs the count.
  - name: batches
    grid:
      min_n_batches: [1, 2, 5, 10, 25, 50]
      max_batch_cube_size: [Inf]

  # 12. Iterative vs fixed at an EQUAL coalition budget (dependent pair).
  - name: iterative_budget
    pair: iterative
    grid:
      max_n_coalitions: [256, 1024]

  # 13. Realistic medium/heavy workloads. These complement the synthetic
  # parallel sweep above by making each batch substantial enough for worker
  # startup and data-transfer costs to be amortized.
  - name: realistic_medium_sequential
    grid:
      n_train: [1000]
      max_n_coalitions: [512]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [1]
      min_n_batches: [1, 8, 32]
      max_batch_cube_size: [Inf]

  - name: realistic_medium_parallel
    grid:
      n_train: [1000]
      max_n_coalitions: [512]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [4, 8, 16]
      min_n_batches: [8, 32]
      max_batch_cube_size: [Inf]

  - name: realistic_heavy_sequential
    grid:
      n_train: [1000]
      max_n_coalitions: [1024]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [1]
      min_n_batches: [1, 8, 32]
      max_batch_cube_size: [Inf]

  - name: realistic_heavy_parallel
    grid:
      n_train: [1000]
      max_n_coalitions: [1024]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [4, 8, 16]
      min_n_batches: [8, 32]
      max_batch_cube_size: [Inf]

  # 14. Dense-batch memory calibration. These cap levels progressively allow
  # larger Gaussian batches and expose the time/RAM trade-off directly.
  - name: memory_cap_sequential
    grid:
      n_features: [12]
      n_train: [1000]
      max_n_coalitions: [1024]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [1]
      min_n_batches: [8]
      max_batch_cube_size: [1e6, 4e6, 16e6, 64e6, Inf]

  - name: memory_cap_parallel
    grid:
      n_features: [12]
      n_train: [1000]
      max_n_coalitions: [1024]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [4]
      min_n_batches: [8]
      max_batch_cube_size: [1e6, 4e6, 16e6, 64e6, Inf]

  - name: memory_cap_highdim
    grid:
      n_features: [20]
      n_train: [1000]
      max_n_coalitions: [512]
      n_MC_samples: [250]
      n_explain: [50]
      workers: [1]
      min_n_batches: [8]
      max_batch_cube_size: [1e6, 4e6, 16e6, 64e6, Inf]

  # 15. Accuracy/cost interaction surface. Explanations are saved only for
  # these rows because accuracy.R compares them with the high-budget reference.
  - name: accuracy_cost
    grid:
      n_features: [8]
      n_train: [1000]
      max_n_coalitions: [32, 64, 128, 256]
      n_MC_samples: [25, 100, 400]
      n_explain: [10, 50]
      workers: [1]
      min_n_batches: [16]
      max_batch_cube_size: [Inf]
      save_explanations: [true]

  - name: accuracy_reference
    grid:
      n_features: [8]
      n_train: [1000]
      max_n_coalitions: [256]
      n_MC_samples: [2000]
      n_explain: [50]
      workers: [1]
      min_n_batches: [32]
      max_batch_cube_size: [Inf]
      save_explanations: [true]

  # 16. Real prediction-model cost at a fixed explanation workload. The three
  # variants span a cheap linear model, the standard XGBoost model, and a much
  # larger XGBoost model.
  - name: prediction_model
    grid:
      n_features: [12]
      n_train: [1000]
      max_n_coalitions: [512]
      n_MC_samples: [250]
      n_explain: [50]
      workers: [1, 4, 16]
      min_n_batches: [32]
      max_batch_cube_size: [Inf]
      model_variant: [linear, xgb, xgb_large]
