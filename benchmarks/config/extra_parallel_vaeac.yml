# Optional realistic-workload parallel study; excluded from run_week.sh.
# VAEAC uses multicore because trained torch objects cannot be serialized to
# multisession workers.
approach: vaeac
dataset: numeric

replicates: 2
warmup: false
cooldown_sec: 0.2
timeout_sec: 3600
time_budget_sec: 14400

blocks:
  - name: training_dominated_sequential
    grid:
      n_train: [1000]
      max_n_coalitions: [128]
      n_explain: [25]
      workers: [1]
      backend: [multicore]
      min_n_batches: [4, 16, 64]
      max_batch_cube_size: [Inf]
    approach_args:
      vaeac.epochs: [30]

  - name: training_dominated_parallel
    grid:
      n_train: [1000]
      max_n_coalitions: [128]
      n_explain: [25]
      workers: [4, 16]
      backend: [multicore]
      min_n_batches: [16, 64]
      max_batch_cube_size: [Inf]
    approach_args:
      vaeac.epochs: [30]

  - name: explanation_heavy_sequential
    grid:
      n_train: [1000]
      max_n_coalitions: [512]
      n_explain: [100]
      workers: [1]
      backend: [multicore]
      min_n_batches: [4, 16, 64]
      max_batch_cube_size: [Inf]
    approach_args:
      vaeac.epochs: [10]

  - name: explanation_heavy_parallel
    grid:
      n_train: [1000]
      max_n_coalitions: [512]
      n_explain: [100]
      workers: [4, 16]
      backend: [multicore]
      min_n_batches: [16, 64]
      max_batch_cube_size: [Inf]
    approach_args:
      vaeac.epochs: [10]
