# ============================================================================
# regression_separate.yml — cost study for the `regression_separate` approach.
#
# Fits one regression model per coalition. Its headline knob is the regression
# recipe: we test TWO frameworks x THREE tuning levels via named variants from
# R/registry.R (built to follow the regression vignette):
#   * smooth_* — GAM-like: natural splines (step_ns) + (penalized) linear model
#     via glmnet.   smooth_none = no tuning, smooth_light = small grid + 2-fold
#     CV, smooth_cv = larger grid + 5-fold CV.
#   * xgb_*    — xgboost boost_tree.   xgb_none / xgb_light / xgb_cv, same idea.
# Supports all dataset families -> includes the mixed/categorical dataset sweep.
# Baseline numeric. Requires `parsnip` (+ `glmnet`/`xgboost` per variant).
# Inherits timeout (1 h) + 24 h budget.
#
# Run with:  bin/orchestrate.sh config/regression_separate.yml
# ============================================================================
approach: regression_separate
dataset: numeric

replicates: 3
warmup: true

blocks:
  - name: scale_train_mc
    grid:
      n_train: [500, 5000, 20000]
      n_MC_samples: [50, 250]

  - name: features
    grid:
      n_features: [4, 8, 12, 16, 20]

  - name: coalitions
    grid:
      max_n_coalitions: [32, 128, 256, 512]

  - name: explain
    grid:
      n_explain: [1, 25, 100]

  - name: dt_threads
    grid:
      dt_threads: [1, 2, 4, 8]

  - name: parallel
    grid:
      workers: [1, 2, 4, 8, 16, 32]
      min_n_batches: [8, 32, 128]

  - name: batches
    grid:
      min_n_batches: [1, 5, 25]
      max_batch_cube_size: [Inf]

  - name: iterative_budget
    pair: iterative
    grid:
      max_n_coalitions: [256, 1024]

  - name: dataset
    grid:
      dataset: [mixed_fc_fl, mixed_fc_ml, mixed_mc_fl, mixed_mc_ml, categorical]

  # Regression-framework variants: smooth (GAM-like) and xgboost, each at no /
  # light / cv tuning. Held at the baseline numeric point.
  - name: variants
    approach_args:
      variant: [smooth_none, smooth_light, smooth_cv, xgb_none, xgb_light, xgb_cv]
