# ============================================================================
# factorial_weekend.yml — partial-factorial study, full "weekend" scale
#
# Larger cross-product over more dimensions and levels. This grows fast:
# the total run count is the PRODUCT of all factor lengths (times datasets,
# replicates, and the warm-up). Trim factors/levels if it is too large.
#
# Merged on top of common.yml.
# ============================================================================
design: factorial
scale: weekend

replicates: 3

factors:
  approach: [gaussian, copula, empirical, ctree, arf]
  n_train: [100, 1000, 5000, 20000]
  n_MC_samples: [50, 250, 1000]
  max_n_coalitions: [32, 128, 512]
  workers: [1, 4]

fixed:
  dataset: numeric     # all five approaches support all-numeric data
  n_features: 8
  min_n_batches: 10
  backend: multisession
  n_explain: 25
  iterative: false
