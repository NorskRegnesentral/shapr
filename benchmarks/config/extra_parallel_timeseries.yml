# Optional realistic-workload parallel study; excluded from run_week.sh.
approach: timeseries
dataset: numeric

replicates: 2
warmup: false
cooldown_sec: 0.2
timeout_sec: 1800
time_budget_sec: 14400

blocks:
  - name: medium_sequential
    grid:
      n_train: [1000]
      max_n_coalitions: [256]
      n_explain: [25]
      workers: [1]
      min_n_batches: [1, 8, 32]

  - name: medium_parallel
    grid:
      n_train: [1000]
      max_n_coalitions: [256]
      n_explain: [25]
      workers: [4, 16]
      min_n_batches: [8, 32]

  - name: heavy_sequential
    grid:
      n_train: [2500]
      max_n_coalitions: [256]
      n_explain: [50]
      workers: [1]
      min_n_batches: [2, 8, 32]

  - name: heavy_parallel
    grid:
      n_train: [2500]
      max_n_coalitions: [256]
      n_explain: [50]
      workers: [4, 16]
      min_n_batches: [8, 32]

  # Fill the safe-frontier gap between the 4- and 16-worker heavy runs without
  # revisiting the resource-killed 16-worker/32-batch combination.
  - name: heavy_parallel_8workers
    grid:
      n_train: [2500]
      max_n_coalitions: [256]
      n_explain: [50]
      workers: [8]
      min_n_batches: [8]
