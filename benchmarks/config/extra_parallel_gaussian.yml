# Optional realistic-workload parallel study. The `extra_parallel_` prefix keeps
# this extension separate from the core per-approach suite and run_week.sh.
approach: gaussian
dataset: numeric

replicates: 2
cooldown_sec: 0.2
timeout_sec: 1800
time_budget_sec: 14400

blocks:
  - name: medium_sequential
    grid:
      n_train: [1000]
      max_n_coalitions: [512]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [1]
      min_n_batches: [1, 8, 32]
      max_batch_cube_size: [Inf]

  - name: medium_parallel
    grid:
      n_train: [1000]
      max_n_coalitions: [512]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [4, 8, 16]
      min_n_batches: [8, 32]
      max_batch_cube_size: [Inf]

  - name: heavy_sequential
    grid:
      n_train: [1000]
      max_n_coalitions: [1024]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [1]
      min_n_batches: [1, 8, 32]
      max_batch_cube_size: [Inf]

  - name: heavy_parallel
    grid:
      n_train: [1000]
      max_n_coalitions: [1024]
      n_MC_samples: [250]
      n_explain: [100]
      workers: [4, 8, 16]
      min_n_batches: [8, 32]
      max_batch_cube_size: [Inf]
